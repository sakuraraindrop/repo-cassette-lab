name: legacy artifact channel probe 2
on:
  push:
    paths:
      - '.github/workflows/legacy2.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: ./legacy2
        env:
          GITHUB_TOKEN: ${{ github.token }}
